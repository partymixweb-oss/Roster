function renderBudget(){
  if(!ui.mgrUnlocked){
    return renderAdminPinGate('Enter the Admin PIN to see wage estimates and labour costs.');
  }
  ensureMgrDraft();

  var rows = [];
  var grandTotal = 0, totalHours = 0, unfilledHours = 0;
  var roleTotals = {manager:0, supervisor:0, retail:0, online_orders:0};
  ui.mgrDraft.staff.forEach(function(s){
    var hrsByType = {weekday:0, sat:0, sun:0};
    ui.mgrDraft.shifts.forEach(function(sh){
      if(sh.staffId!==s.id) return;
      hrsByType[dayType(sh.day)] += shiftHours(sh);
    });
    var rates = s.rates || {weekday:0, sat:0, sun:0};
    var cost = hrsByType.weekday*(rates.weekday||0) + hrsByType.sat*(rates.sat||0) + hrsByType.sun*(rates.sun||0);
    var hrs = hrsByType.weekday + hrsByType.sat + hrsByType.sun;
    grandTotal += cost; totalHours += hrs;
    roleTotals[s.role] = (roleTotals[s.role]||0) + cost;
    rows.push({s:s, hrsByType:hrsByType, hrs:hrs, rates:rates, cost:cost});
  });
  ui.mgrDraft.shifts.forEach(function(sh){ if(!sh.staffId) unfilledHours += shiftHours(sh); });

  var out = '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">' +
    '<div><h2 class="section-title">Wage budget</h2>' +
    '<p class="section-sub">Only you can see this. Rates are per hour and split by weekday / Saturday / Sunday — set them below, or send me a rate sheet and I\'ll fill them in for you. Totals use the same draft as the Admin tab, so edit shift times or staff there and they\'ll update here too. Nothing is saved until you publish.</p></div>' +
    '<select class="inline-select" style="width:auto;" data-action="set-currency">' +
      ['£','$','€'].map(function(c){ return '<option value="' + c + '"' + ((STATE.currency||'£')===c ? ' selected' : '') + '>' + c + '</option>'; }).join('') +
    '</select>' +
  '</div>';

  out += '<div class="card" style="text-align:center;">' +
    '<p style="margin:0; font-size:0.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; font-weight:700;">Estimated total this week</p>' +
    '<p class="mono" style="margin:4px 0 0; font-size:2.1rem; font-weight:800;">' + fmtMoney(grandTotal) + '</p>' +
    '<p style="margin:4px 0 0; color:var(--muted); font-size:0.8rem;">' + fmtHours(totalHours) + ' scheduled' + (unfilledHours>0 ? ' · ' + fmtHours(unfilledHours) + ' unfilled (not costed)' : '') + '</p>' +
  '</div>';

  out += '<div class="card" style="display:flex; gap:14px; flex-wrap:wrap; text-align:center;">' +
    ROLE_ORDER.map(function(r){
      return '<div style="flex:1 1 80px;"><div style="font-size:0.7rem; color:var(--muted); text-transform:uppercase; font-weight:700;">' + roleLabel(r) + '</div>' +
        '<div class="mono" style="font-weight:800; font-size:0.95rem;">' + fmtMoney(roleTotals[r]||0) + '</div></div>';
    }).join('') +
  '</div>';

  out += '<h2 class="section-title" style="margin-top:18px; font-size:0.9rem;">Rates &amp; hours by person</h2>' +
    '<p class="section-sub">Each person has a separate rate for weekdays, Saturdays and Sundays. The hours shown under each rate are what they\'re scheduled for in that bucket this week.</p>';
  rows.forEach(function(r){
    out += '<div class="card" style="margin-bottom:10px;">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px;">' +
        '<div><strong style="font-size:0.9rem;">' + esc(r.s.name) + '</strong><br>' +
        '<span class="badge ' + roleClass(r.s.role) + '" style="margin-top:3px;">' + roleLabel(r.s.role) + '</span></div>' +
        '<div style="text-align:right;"><div class="field-label" style="margin:0 0 2px;">Total cost</div>' +
        '<div class="mono" style="font-weight:800; font-size:1.05rem;">' + fmtMoney(r.cost) + '</div></div>' +
      '</div>' +
      '<div class="rate-grid">' +
        ['weekday','sat','sun'].map(function(tier){
          return '<div><label class="field-label" style="margin:0 0 3px;">' + DAY_TYPE_LABEL[tier] + ' £/hr</label>' +
            '<input type="text" inputmode="decimal" class="inline-select" data-action="draft-staff-rate" data-staff="' + r.s.id + '" data-tier="' + tier + '" value="' + (r.rates[tier] || '') + '" placeholder="0.00">' +
            '<div class="mono" style="font-size:0.72rem; color:var(--muted); margin-top:4px; text-align:center;">' + fmtHours(r.hrsByType[tier]) + '</div></div>';
        }).join('') +
      '</div>' +
    '</div>';
  });

  out += '<div style="display:flex; gap:10px; margin-top:6px;">' +
    '<button class="btn btn-primary" data-action="save-mgr">Save &amp; publish changes</button>' +
    '<button class="btn btn-secondary" data-action="discard-mgr">Discard</button>' +
    '<button class="ghost-btn" data-action="lock-mgr" style="margin-left:auto;">Lock</button>' +
  '</div>';
  return out;
}

// ---------- shared shift actions (used by both the My Shifts cards and the grid detail modal) ----------
function acceptShift(id){
  var s = STATE.shifts.find(function(x){ return x.id===id; });
  if(s && s.staffId===ui.me && s.status==='pending'){
    s.status='confirmed';
    render();
    staffSave('accept', {shiftId: id}, 'Shift confirmed.', {
      request: 'Hi, it\'s ' + staffNameMe() + ' — I accept my shift on ' + shiftDesc(s) + '.',
      onSuccess: function(){ celebrate("Let's Get It!! 🎉"); }
    });
  }
}
function releaseShift(id){
  var s = STATE.shifts.find(function(x){ return x.id===id; });
  if(s && s.staffId===ui.me){
    var req = 'Hi, it\'s ' + staffNameMe() + ' — I can\'t do my shift on ' + shiftDesc(s) + '. Can it be opened up for someone else?';
    s.originalStaffId = s.staffId; s.staffId = null; s.status='open'; render();
    staffSave('release', {shiftId: id}, 'Shift released — it\'s now open for pickup.', {request: req});
  }
}
function claimShift(id){
  var s = STATE.shifts.find(function(x){ return x.id===id; });
  if(!ui.me){ toast('Select your name first.'); return; }
  if(s && s.status==='open'){
    var req = 'Hi, it\'s ' + staffNameMe() + ' — I\'d like to pick up the open shift on ' + shiftDesc(s) + '.';
    s.staffId = ui.me; s.status='confirmed'; render();
    staffSave('claim', {shiftId: id}, 'You\'re on it — shift claimed.', {request: req});
  }
}

// ---------- actions ----------
function onClick(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');

  if(action==='switch-id'){ logoutStaff(); render(); return; }
  if(action==='staff-login'){
    var loginId = document.getElementById('idSelect').value;
    var loginPin = document.getElementById('idPin').value.trim();
    if(!loginId){ toast('Select your name first.'); return; }
    if(!loginPin){ toast('Enter your PIN.'); return; }
    el.disabled = true; el.textContent = 'Checking…';
    server('verifyStaff', [loginId, loginPin]).then(function(res){
      if(res && res.ok){
        persistMe(loginId);
        ui.myPin = loginPin;
        try{ localStorage.setItem('roster_pin_v1', loginPin); }catch(e2){}
        render();
      } else {
        toast((res && res.message) || 'Incorrect PIN for that name.');
        render();
      }
    }, function(){ toast('Couldn\'t reach the roster — check your connection.'); render(); });
    return;
  }
  if(action==='confirm-yes'){ var fn = pendingConfirmAction; hideConfirm(); if(fn) fn(); return; }
  if(action==='confirm-no'){ hideConfirm(); return; }
  if(action==='close-detail'){ hideDetail(); return; }
  if(action==='grid-cell'){ openCellModal(el.getAttribute('data-week'), el.getAttribute('data-day'), el.getAttribute('data-staff')); return; }
  if(action==='tab'){ persistTab(el.getAttribute('data-tab')); render(); return; }
  if(action==='week-prev'){ persistWeekView(addDaysISO(ui.weekView || weekStartKey(), -7)); render(); return; }
  if(action==='week-next'){ persistWeekView(addDaysISO(ui.weekView || weekStartKey(), 7)); render(); return; }
  if(action==='week-jump-active'){ persistWeekView(null); render(); return; }

  if(action==='accept'){ acceptShift(el.getAttribute('data-shift')); return; }
  if(action==='release'){ releaseShift(el.getAttribute('data-shift')); return; }
  if(action==='claim'){ claimShift(el.getAttribute('data-shift')); return; }
  if(action==='detail-accept'){ hideDetail(); acceptShift(el.getAttribute('data-shift')); return; }
  if(action==='detail-release'){ hideDetail(); releaseShift(el.getAttribute('data-shift')); return; }
  if(action==='detail-claim'){ hideDetail(); claimShift(el.getAttribute('data-shift')); return; }

  if(action==='copy-request'){
    var copyText = ui.pendingRequestText || '';
    var done = function(){ toast('Copied — paste it to the admin.'); };
    // Older-style copy works inside Google's page frame where the newer
    // clipboard API is often blocked.
    var legacyCopy = function(){
      var ta = document.createElement('textarea');
      ta.value = copyText; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try{ ok = document.execCommand('copy'); }catch(e3){}
      document.body.removeChild(ta);
      if(ok) done(); else toast('Couldn\'t copy — use WhatsApp or Text instead.');
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(copyText).then(done, legacyCopy);
    } else { legacyCopy(); }
    return;
  }
  if(action==='request-edit'){ openEditRequestModal(el.getAttribute('data-shift')); return; }
  if(action==='submit-edit-request'){
    var reqShift = STATE.shifts.find(function(x){ return x.id===el.getAttribute('data-shift'); });
    if(!reqShift || reqShift.staffId !== ui.me){ hideDetail(); return; }
    var reqStart = document.getElementById('reqStart').value;
    var reqEnd = document.getElementById('reqEnd').value;
    var reqNote = document.getElementById('reqNote').value.trim();
    if(!reqStart || !reqEnd){ toast('Set a start and end time.'); return; }
    if(reqEnd <= reqStart){ toast('End time needs to be after the start time.'); return; }
    var reqText = 'Hi, it\'s ' + staffNameMe() + ' — can my shift on ' + shiftDesc(reqShift) + ' be changed to ' +
      fmtTime(reqStart) + '–' + fmtTime(reqEnd) + '?' + (reqNote ? '\nNote: ' + reqNote : '');
    reqShift.editRequest = {start:reqStart, end:reqEnd, note:reqNote, status:'pending'};
    hideDetail();
    render();
    staffSave('edit-request', {shiftId: reqShift.id, start: reqStart, end: reqEnd, note: reqNote}, 'Shift change requested — waiting on admin approval.', {request: reqText});
    return;
  }
  if(action==='cancel-edit-request'){
    var cancelShift = STATE.shifts.find(function(x){ return x.id===el.getAttribute('data-shift'); });
    if(cancelShift && cancelShift.staffId===ui.me && cancelShift.editRequest){
      delete cancelShift.editRequest;
      render();
      staffSave('edit-cancel', {shiftId: cancelShift.id}, 'Change request cancelled.');
    }
    return;
  }
  if(action==='dismiss-edit-request'){
    var dismissShift = STATE.shifts.find(function(x){ return x.id===el.getAttribute('data-shift'); });
    if(dismissShift && dismissShift.staffId===ui.me && dismissShift.editRequest){
      delete dismissShift.editRequest;
      render();
      staffSave('edit-dismiss', {shiftId: dismissShift.id}, 'Dismissed.');
    }
    return;
  }
  if(action==='approve-edit-request'){
    var apprShift = STATE.shifts.find(function(x){ return x.id===el.getAttribute('data-shift'); });
    var apprId = el.getAttribute('data-shift');
    if(apprShift && apprShift.editRequest){
      adminCommit(function(){
        var s = STATE.shifts.find(function(x){ return x.id===apprId; });
        if(!s || !s.editRequest || s.editRequest.status!=='pending') return;
        s.start = s.editRequest.start;
        s.end = s.editRequest.end;
        delete s.editRequest;
      }, 'Shift change approved.');
    }
    return;
  }
  if(action==='reject-edit-request'){
    var rejShift = STATE.shifts.find(function(x){ return x.id===el.getAttribute('data-shift'); });
    var rejId = el.getAttribute('data-shift');
    if(rejShift && rejShift.editRequest){
      adminCommit(function(){
        var s = STATE.shifts.find(function(x){ return x.id===rejId; });
        if(s && s.editRequest && s.editRequest.status==='pending') s.editRequest.status = 'rejected';
      }, 'Shift change declined.');
    }
    return;
  }

  if(action==='cell-edit-start'){
    var ctxEdit = ui.cellCtx; if(!ctxEdit) return;
    var shiftEdit = findShiftInWeek(ctxEdit.weekKey, ctxEdit.dayKey, ctxEdit.staffId);
    document.getElementById('detailBox').innerHTML = cellEditFormHTML(ctxEdit, shiftEdit);
    return;
  }
  if(action==='cell-save'){
    var ctxSave = ui.cellCtx; if(!ctxSave) return;
    var startVal2 = document.getElementById('cellStart').value;
    var endVal2 = document.getElementById('cellEnd').value;
    var roleVal2 = document.getElementById('cellRole').value;
    if(!startVal2 || !endVal2){ toast('Set a start and end time.'); return; }
    if(endVal2 <= startVal2){ toast('End time needs to be after the start time.'); return; }
    var newShiftId = 'sh_' + Date.now().toString(36) + Math.floor(Math.random()*1000);
    var savedShift;
    ui.mgrDraft = null; ui.mgrDraftBase = null;
    adminCommit(function(){
      var arr = getWeekShiftsArray(ctxSave.weekKey);
      var existing = arr.find(function(s){ return s.staffId===ctxSave.staffId && s.day===ctxSave.dayKey; }) ||
                     arr.find(function(s){ return s.originalStaffId===ctxSave.staffId && s.day===ctxSave.dayKey && s.status==='open'; });
      if(existing){
        existing.staffId = ctxSave.staffId; existing.originalStaffId = ctxSave.staffId;
        existing.start = startVal2; existing.end = endVal2; existing.role = roleVal2; existing.status = 'pending';
        delete existing.editRequest;
        savedShift = existing;
      } else {
        savedShift = {id:newShiftId, staffId:ctxSave.staffId, originalStaffId:ctxSave.staffId, day:ctxSave.dayKey, start:startVal2, end:endVal2, role:roleVal2, status:'pending'};
        arr.push(savedShift);
      }
    }, 'Shift saved.');
    var notifyStaff = staffById(ctxSave.staffId);
    if(notifyStaff) document.getElementById('detailBox').innerHTML = notifyPanelHTML(ctxSave, notifyStaff, savedShift);
    return;
  }
  if(action==='cell-remove'){
    var ctxRemove = ui.cellCtx; if(!ctxRemove) return;
    var existingR = getWeekShiftsArray(ctxRemove.weekKey).find(function(s){ return s.staffId===ctxRemove.staffId && s.day===ctxRemove.dayKey; });
    if(!existingR){ hideDetail(); return; }
    var removeId = existingR.id;
    hideDetail();
    ui.mgrDraft = null; ui.mgrDraftBase = null;
    adminCommit(function(){
      var arrR = getWeekShiftsArray(ctxRemove.weekKey);
      setWeekShiftsArray(ctxRemove.weekKey, arrR.filter(function(s){ return s.id !== removeId; }));
    }, 'Shift removed.');
    return;
  }

  if(action==='set-avail'){
    if(!ui.me) return;
    var day = el.getAttribute('data-day'); var val = el.getAttribute('data-val');
    ensureAvailDraft();
    ui._availDraft.days[day] = ui._availDraft.days[day] || {};
    ui._availDraft.days[day].status = val;
    if(val==='limited'){ ui._availDraft.days[day].from = ui._availDraft.days[day].from || '09:00'; ui._availDraft.days[day].to = ui._availDraft.days[day].to || '17:00'; }
    renderAvailInPlace();
    return;
  }
  if(action==='save-avail'){
    if(!ui.me) return;
    ensureAvailDraft();
    ui._availDraft.note = document.getElementById('availNote').value;
    STATE.availability[ui.me] = { days: ui._availDraft.days, note: ui._availDraft.note, updatedAt: new Date().toISOString() };
    var availReq = availabilityRequestText(STATE.availability[ui.me]);
    ui._availDraft = null;
    render();
    staffSave('availability', {days: STATE.availability[ui.me].days, note: STATE.availability[ui.me].note}, 'Availability saved.', {request: availReq});
    return;
  }

  if(action==='add-timeoff'){
    if(!ui.me) return;
    var toStart = document.getElementById('timeOffStart').value;
    var toEnd = document.getElementById('timeOffEnd').value;
    var toNote = document.getElementById('timeOffNote').value.trim();
    if(!toStart){ toast('Pick a start date.'); return; }
    if(!toEnd) toEnd = toStart;
    if(toEnd < toStart){ toast('The end date needs to be on or after the start date.'); return; }
    var toId = 'to_' + Date.now().toString(36) + Math.floor(Math.random()*1000);
    STATE.timeOff.push({id: toId, staffId: ui.me, start: toStart, end: toEnd, note: toNote});
    render();
    staffSave('timeoff-add', {id: toId, start: toStart, end: toEnd, note: toNote}, 'Time off added.', {request: 'Hi, it\'s ' + staffNameMe() + ' — I\'ll be away ' +
      (toStart === toEnd ? 'on ' + toStart : 'from ' + toStart + ' to ' + toEnd) + (toNote ? ' (' + toNote + ')' : '') + '.'});
    return;
  }
  if(action==='remove-timeoff'){
    var timeoffId = el.getAttribute('data-timeoff');
    var toEntry = STATE.timeOff.find(function(t){ return t.id===timeoffId; });
    if(!toEntry || toEntry.staffId !== ui.me) return;
    STATE.timeOff = STATE.timeOff.filter(function(t){ return t.id!==timeoffId; });
    render();
    staffSave('timeoff-remove', {id: timeoffId}, 'Time off removed.');
    return;
  }

  if(action==='try-pin'){
    var pin = document.getElementById('pinInput').value.trim();
    if(!pin){ toast('Enter the Admin PIN.'); return; }
    el.disabled = true; el.textContent = 'Checking…';
    server('getAdminState', [pin]).then(function(res){
      if(res && res.ok){
        ui.adminPin = pin;
        try{ sessionStorage.setItem('roster_admin_pin_v1', pin); }catch(e2){}
        persistMgr(true); ui.mgrDraft = null; ui.mgrDraftBase = null;
        applyServer(res);
      } else {
        toast((res && res.message) || 'Incorrect Admin PIN.');
        render();
      }
    }, function(){ toast('Couldn\'t reach the roster — check your connection.'); render(); });
    return;
  }
  if(action==='lock-mgr'){
    lockAdmin();
    if(ui.tab==='budget') persistTab('my');
    // Drop the admin-only details (PINs, pay rates, contacts) from this screen.
    server('getState', []).then(applyServer, function(){});
    render();
    return;
  }
  if(action==='change-admin-pin'){
    var newAdminPin = (document.getElementById('newAdminPin').value || '').trim();
    if(!/^\d{4,8}$/.test(newAdminPin)){ toast('The new PIN must be 4–8 digits.'); return; }
    el.disabled = true;
    server('changeAdminPin', [ui.adminPin, newAdminPin]).then(function(res){
      if(res && res.ok){
        ui.adminPin = newAdminPin;
        try{ sessionStorage.setItem('roster_admin_pin_v1', newAdminPin); }catch(e4){}
        applyServer(res);
        toast('Admin PIN changed.');
      } else {
        toast((res && res.message) || 'Couldn\'t change the PIN.');
        render();
      }
    }, function(){ toast('Couldn\'t reach the roster — check your connection.'); render(); });
    return;
  }
  if(action==='discard-mgr'){ ui.mgrDraft = null; ui.mgrDraftBase = null; render(); return; }

  if(action==='draft-remove-staff'){
    var sid = el.getAttribute('data-staff');
    ui.mgrDraft.staff = ui.mgrDraft.staff.filter(function(s){ return s.id!==sid; });
    render();
    return;
  }
  if(action==='draft-staff-move-up' || action==='draft-staff-move-down'){
    var moveSid = el.getAttribute('data-staff');
    var moveIdx = ui.mgrDraft.staff.findIndex(function(s){ return s.id===moveSid; });
    var swapWith = action==='draft-staff-move-up' ? moveIdx - 1 : moveIdx + 1;
    if(moveIdx < 0 || swapWith < 0 || swapWith >= ui.mgrDraft.staff.length) return;
    var tmpStaff = ui.mgrDraft.staff[moveIdx];
    ui.mgrDraft.staff[moveIdx] = ui.mgrDraft.staff[swapWith];
    ui.mgrDraft.staff[swapWith] = tmpStaff;
    render();
    return;
  }
  if(action==='draft-add-staff'){
    var name = document.getElementById('newStaffName').value.trim();
    var role = document.getElementById('newStaffRole').value;
    var newPin = document.getElementById('newStaffPin').value.trim();
    var newPhone = document.getElementById('newStaffPhone').value.trim();
    var newEmail = document.getElementById('newStaffEmail').value.trim();
    if(!name){ toast('Enter a name first.'); return; }
    if(!newPin){ toast('Set a PIN for them first.'); return; }
    var id4 = 'st_' + Date.now().toString(36);
    ui.mgrDraft.staff.push({id:id4, name:name, role:role, pin:newPin, phone:newPhone, email:newEmail, rates:{weekday:0, sat:0, sun:0}});
    render();
    return;
  }
  if(action==='draft-remove-shift'){
    var shid = el.getAttribute('data-shift');
    ui.mgrDraft.shifts = ui.mgrDraft.shifts.filter(function(s){ return s.id!==shid; });
    render();
    return;
  }
  if(action==='draft-add-shift'){
    var day2 = el.getAttribute('data-day');
    var staffSel = document.getElementById('newShiftStaff-' + day2).value;
    var roleSel = document.getElementById('newShiftRole-' + day2).value;
    var start = document.getElementById('newShiftStart-' + day2).value;
    var end = document.getElementById('newShiftEnd-' + day2).value;
    var nid = 'sh_' + Date.now().toString(36) + Math.floor(Math.random()*1000);
    ui.mgrDraft.shifts.push({id:nid, staffId:staffSel, originalStaffId:staffSel, day:day2, start:start, end:end, role: roleSel, status:'pending'});
    render();
    return;
  }
  if(action==='save-mgr'){
    if(!ui.mgrDraft) return;
    var draft = ui.mgrDraft, draftBase = ui.mgrDraftBase || [];
    ui.mgrDraft = null; ui.mgrDraftBase = null;
    adminCommit(function(){
      STATE.staff = draft.staff;
      STATE.roleInfo = draft.roleInfo;
      STATE.weekNotes = draft.weekNotes || '';
      STATE.shifts = mergeShifts(draftBase, draft.shifts, STATE.shifts);
    }, 'Roster updated for everyone.');
    return;
  }
  if(action==='reset-week'){
    showConfirm('Reset all shifts to "awaiting response" and clear availability?', function(){
      ui.mgrDraft = null; ui.mgrDraftBase = null;
      adminCommit(function(){
        STATE.shifts.forEach(function(s){
          if(s.status==='open' && s.originalStaffId){ s.staffId = s.originalStaffId; }
          s.status = 'pending';
        });
        STATE.availability = {};
      }, 'Week reset.');
    });
    return;
  }
  if(action==='start-new-week'){
    var startVal = document.getElementById('nextWeekStart').value;
    if(!startVal){ toast('Pick the date this new week starts.'); return; }
    var clearAll = document.getElementById('clearShiftsOnRollover').checked;
    var msg = clearAll
      ? 'Start the week of ' + startVal + ' with a blank slate? This clears all shifts and availability.'
      : 'Start the week of ' + startVal + '? Shifts carry over as a template, reset to "awaiting response", and availability is cleared.';
    showConfirm(msg, function(){
     ui.mgrDraft = null; ui.mgrDraftBase = null;
     var weekBefore = STATE.days[0].iso;
     adminCommit(function(){
      // Someone already started a new week while this was open — don't roll twice.
      if(STATE.days[0].iso !== weekBefore) return;
      // Archive the outgoing week so it stays browsable as history via the
      // Week tab's Prev/Next navigation.
      var oldStart = STATE.days[0].iso;
      STATE.weeks[oldStart] = { weekLabel: STATE.weekLabel, days: STATE.days, shifts: STATE.shifts, weekNotes: STATE.weekNotes || '' };
      var oldShifts = STATE.shifts;

      var newDays = buildDays(startVal);
      STATE.days = newDays;
      STATE.weekLabel = formatWeekLabel(newDays);
      // Weekly notice is specific to the week it was written for, so it
      // doesn't carry forward automatically.
      STATE.weekNotes = '';

      // If this week was already pre-planned ahead of time (shifts added via
      // the grid before being officially started), adopt those instead of
      // the usual carry-over template.
      var preplanned = STATE.weeks[startVal];
      if(preplanned && preplanned.shifts && preplanned.shifts.length){
        STATE.shifts = preplanned.shifts.slice();
        delete STATE.weeks[startVal];
      } else if(clearAll){
        STATE.shifts = [];
      } else {
        STATE.shifts = oldShifts.map(function(s){
          var staffId = s.staffId || s.originalStaffId || null;
          return {id:s.id, staffId:staffId, originalStaffId:s.originalStaffId, day:s.day, start:s.start, end:s.end, role:shiftRole(s), status:'pending'};
        });
      }
      STATE.availability = {};
     }, 'New week started: ' + formatWeekLabel(buildDays(startVal)));
    });
    return;
  }
}

// Three-way merge for the "Manage the roster" bulk save. `base` is the shift
// list as it was when the admin started editing, `mine` is the admin's edited
// list, `theirs` is the latest saved list (which may include staff accepting,
// releasing or claiming shifts in the meantime). Shifts the admin changed or
// added use the admin's version; shifts the admin didn't touch keep whatever
// is newest; shifts the admin deleted stay deleted.
function mergeShifts(base, mine, theirs){
  var byId = function(arr){ var m = {}; arr.forEach(function(s){ m[s.id] = s; }); return m; };
  var b = byId(base), t = byId(theirs), seen = {};
  var fields = ['staffId','originalStaffId','day','start','end','role','status'];
  var changed = function(x, y){ return fields.some(function(f){ return (x[f]||null) !== (y[f]||null); }); };
  var out = [];
  mine.forEach(function(s){
    seen[s.id] = true;
    if(!b[s.id] || changed(b[s.id], s)) out.push(s);   // admin added or edited it
    else if(t[s.id]) out.push(t[s.id]);                 // untouched by admin: keep latest
  });
  theirs.forEach(function(s){
    if(!seen[s.id] && !b[s.id]) out.push(s);           // added elsewhere since
  });
  return out;
}

function ensureAvailDraft(){
  if(!ui._availDraft){
    var existing = STATE.availability[ui.me];
    ui._availDraft = existing ? JSON.parse(JSON.stringify(existing)) : { days:{}, note:'' };
  }
}
function renderAvailInPlace(){
  var app = document.getElementById('app');
  app.innerHTML = renderIdentityBar() + renderTabs() + renderAvailabilityFromDraft();
}
function renderAvailabilityFromDraft(){
  // reuse renderAvailability but source current draft values instead of committed state
  var backup = STATE.availability[ui.me];
  STATE.availability[ui.me] = ui._availDraft ? { days: ui._availDraft.days, note: (document.getElementById('availNote') ? document.getElementById('availNote').value : (ui._availDraft.note||'')) } : backup;
  var html = renderAvailability();
  if(backup === undefined) delete STATE.availability[ui.me]; else STATE.availability[ui.me] = backup;
  return html;
}

function onChange(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');
  if(action==='set-avail-time'){
    if(!ui.me) return;
    ensureAvailDraft();
    var day = el.getAttribute('data-day'); var bound = el.getAttribute('data-bound');
    ui._availDraft.days[day] = ui._availDraft.days[day] || {status:'limited'};
    ui._availDraft.days[day][bound] = el.value;
    return;
  }
  if(action==='draft-staff-pin'){
    var sidPin = el.getAttribute('data-staff');
    var stPin = ui.mgrDraft.staff.find(function(s){ return s.id===sidPin; });
    if(stPin) stPin.pin = el.value.trim();
    return;
  }
  if(action==='draft-staff-phone'){
    var sidPhone = el.getAttribute('data-staff');
    var stPhone = ui.mgrDraft.staff.find(function(s){ return s.id===sidPhone; });
    if(stPhone) stPhone.phone = el.value.trim();
    return;
  }
  if(action==='draft-staff-email'){
    var sidEmail = el.getAttribute('data-staff');
    var stEmail = ui.mgrDraft.staff.find(function(s){ return s.id===sidEmail; });
    if(stEmail) stEmail.email = el.value.trim();
    return;
  }
  if(action==='draft-role-info'){
    var roleKeyInfo = el.getAttribute('data-role');
    ui.mgrDraft.roleInfo[roleKeyInfo] = el.value;
    return;
  }
  if(action==='draft-week-notes'){
    ui.mgrDraft.weekNotes = el.value;
    return;
  }
  if(action==='new-shift-staff-pick'){
    // Keep the "Add shift" role dropdown defaulted to whoever is currently
    // picked, so admin only needs to change it when covering a different role.
    var pickedDay = el.getAttribute('data-day');
    var pickedStaff = staffById(el.value);
    var roleSelectEl = document.getElementById('newShiftRole-' + pickedDay);
    if(pickedStaff && roleSelectEl) roleSelectEl.value = pickedStaff.role;
    return;
  }
  if(action==='draft-role'){
    var sid2 = el.getAttribute('data-staff');
    var st2 = ui.mgrDraft.staff.find(function(s){ return s.id===sid2; });
    if(st2) st2.role = el.value;
    return;
  }
  if(action==='draft-staff-rate'){
    var sidRate = el.getAttribute('data-staff');
    var tierRate = el.getAttribute('data-tier');
    var stRate = ui.mgrDraft.staff.find(function(s){ return s.id===sidRate; });
    if(stRate){ stRate.rates = stRate.rates || {weekday:0, sat:0, sun:0}; stRate.rates[tierRate] = parseFloat(el.value) || 0; }
    render();
    return;
  }
  if(action==='set-currency'){
    var newCurrency = el.value;
    adminCommit(function(){ STATE.currency = newCurrency; }, 'Currency updated.');
    return;
  }
  if(action==='draft-shift-staff'){
    var shid2 = el.getAttribute('data-shift');
    var sh2 = ui.mgrDraft.shifts.find(function(s){ return s.id===shid2; });
    if(sh2){ sh2.staffId = el.value; sh2.originalStaffId = el.value; }
    return;
  }
  if(action==='draft-shift-role'){
    var shRole = ui.mgrDraft.shifts.find(function(s){ return s.id===el.getAttribute('data-shift'); });
    if(shRole) shRole.role = el.value;
    return;
  }
  if(action==='draft-shift-start'){
    var sh3 = ui.mgrDraft.shifts.find(function(s){ return s.id===el.getAttribute('data-shift'); });
    if(sh3) sh3.start = el.value;
    return;
  }
  if(action==='draft-shift-end'){
    var sh4 = ui.mgrDraft.shifts.find(function(s){ return s.id===el.getAttribute('data-shift'); });
    if(sh4) sh4.end = el.value;
    return;
  }
}

document.addEventListener('click', onClick);
document.addEventListener('change', onChange);
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(e.target && e.target.id === 'idPin'){ e.preventDefault(); var b1 = document.querySelector('[data-action="staff-login"]'); if(b1) b1.click(); }
  if(e.target && e.target.id === 'pinInput'){ e.preventDefault(); var b2 = document.querySelector('[data-action="try-pin"]'); if(b2) b2.click(); }
});

startPolling();

render();
}

// Shared with the loader below (outside App) so the page can fetch the roster
// before App starts. credentials:'omit' sends no Google cookies at all, so
// people signed in to several Google accounts aren't affected.
function callApi(fn, args){
  return fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({fn: fn, args: args || []}),
    credentials: 'omit',
    redirect: 'follow'
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(j){
    if(j && j.error) throw new Error(j.error);
    return j ? j.result : null;
  });
}

(function boot(){
  var el = document.getElementById('state-data');
  if(el.textContent.trim() !== 'null'){ App(); return; }
  var app = document.getElementById('app');
  app.innerHTML = '<div class="empty" style="margin-top:20px;">Loading the roster…</div>';
  callApi('getState', []).then(function(res){
    if(!res || !res.state) throw new Error('No roster returned');
    el.textContent = JSON.stringify({state: res.state, version: res.version, url: location.origin + location.pathname});
    App();
  }).catch(function(){
    app.innerHTML = '<div class="empty" style="margin-top:20px;">Couldn\'t load the roster — check your internet connection.' +
      '<div style="margin-top:12px;"><button class="btn btn-primary" onclick="location.reload()">Try again</button></div></div>';
  });
})();</script>
