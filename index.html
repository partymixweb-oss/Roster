<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party Mix Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#EAF6FF;
    --border:#CFE4F7;
    --ink:#1B241D;
    --ink-soft:#4B564C;
    --muted:#707B6E;
    --brand-navy:#1b0392;
    --brand-blue:#0057ff;
    --brand-skyblue:#a0e5ff;
    --accent:#0057ff;
    --accent-strong:#1b0392;
    --accent-ink:#FFFFFF;
    --accent-soft:#a0e5ff;
    --topbar-bg:#1b0392;
    --topbar-ink:#FFFFFF;
    --topbar-muted:#a0e5ff;
    --role-manager:#1B0392;
    --role-manager-soft:#E6E0FA;
    --role-supervisor:#0057FF;
    --role-supervisor-soft:#DCE8FF;
    --role-retail:#1A1A1A;
    --role-retail-soft:#E6E6E6;
    --role-online_orders:#000000;
    --role-online_orders-soft:#A0E5FF;
    --status-pending:#A9700A;
    --status-pending-soft:#F5E7CE;
    --status-confirmed:#2F8F5B;
    --status-confirmed-soft:#DDF0E4;
    --status-open:#C4463D;
    --status-open-soft:#F8DEDC;
    --shadow:0 1px 2px rgba(27,36,29,0.06), 0 4px 14px rgba(27,36,29,0.06);
    --radius:16px;
    --font-display:'Baloo 2', 'Manrope', system-ui, sans-serif;
    --glow-shadow:0 4px 18px rgba(0,87,255,0.28);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12181A;
      --surface:#1A2224;
      --surface-2:#1C2740;
      --border:#2A3A52;
      --ink:#EBF1EC;
      --ink-soft:#C3CCC4;
      --muted:#8D9A8E;
      --brand-navy:#1b0392;
      --brand-blue:#0057ff;
      --brand-skyblue:#a0e5ff;
      --accent:#5B8CFF;
      --accent-strong:#a0e5ff;
      --accent-ink:#0B1B3D;
      --accent-soft:#241068;
      --topbar-bg:#1b0392;
      --topbar-ink:#FFFFFF;
      --topbar-muted:#a0e5ff;
      --role-manager:#B9AEFF;
      --role-manager-soft:#2B1770;
      --role-supervisor:#7FB1FF;
      --role-supervisor-soft:#1B3A66;
      --role-retail:#D5D5D5;
      --role-retail-soft:#2A2A2A;
      --role-online_orders:#A0E5FF;
      --role-online_orders-soft:#123C57;
      --status-pending:#E3A94A;
      --status-pending-soft:#3D2F10;
      --status-confirmed:#6ED39A;
      --status-confirmed-soft:#123522;
      --status-open:#EF8983;
      --status-open-soft:#3D1917;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
      --glow-shadow:0 4px 20px rgba(91,140,255,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12181A;
    --surface:#1A2224;
    --surface-2:#1C2740;
    --border:#2A3A52;
    --ink:#EBF1EC;
    --ink-soft:#C3CCC4;
    --muted:#8D9A8E;
    --brand-navy:#1b0392;
    --brand-blue:#0057ff;
    --brand-skyblue:#a0e5ff;
    --accent:#5B8CFF;
    --accent-strong:#a0e5ff;
    --accent-ink:#0B1B3D;
    --accent-soft:#241068;
    --topbar-bg:#1b0392;
    --topbar-ink:#FFFFFF;
    --topbar-muted:#a0e5ff;
    --role-manager:#B9AEFF;
    --role-manager-soft:#2B1770;
    --role-supervisor:#7FB1FF;
    --role-supervisor-soft:#1B3A66;
    --role-retail:#D5D5D5;
    --role-retail-soft:#2A2A2A;
    --role-online_orders:#A0E5FF;
    --role-online_orders-soft:#123C57;
    --status-pending:#E3A94A;
    --status-pending-soft:#3D2F10;
    --status-confirmed:#6ED39A;
    --status-confirmed-soft:#123522;
    --status-open:#EF8983;
    --status-open-soft:#3D1917;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
    --glow-shadow:0 4px 20px rgba(91,140,255,0.35);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:56px;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  .topbar{
    background:
      radial-gradient(circle at 8px 10px, rgba(160,229,255,0.35) 1.5px, transparent 1.6px),
      radial-gradient(circle at 46px 34px, rgba(255,255,255,0.3) 1.5px, transparent 1.6px),
      radial-gradient(circle at 84px 14px, rgba(160,229,255,0.28) 1.5px, transparent 1.6px),
      radial-gradient(circle at 122px 38px, rgba(255,255,255,0.22) 1.5px, transparent 1.6px),
      radial-gradient(circle at 160px 12px, rgba(160,229,255,0.3) 1.5px, transparent 1.6px),
      linear-gradient(120deg, var(--brand-navy) 0%, var(--topbar-bg) 55%, var(--brand-blue) 140%);
    background-size:180px 56px, 180px 56px, 180px 56px, 180px 56px, 180px 56px, 100% 100%;
    border-bottom:1px solid var(--border);
    padding:16px 16px 18px;
    position:sticky; top:0; z-index:20;
  }
  .topbar-inner{max-width:760px; margin:0 auto;}
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand-title{display:flex; align-items:center; gap:11px; min-width:0;}
  .brand-logo{
    width:46px; height:46px; border-radius:50%; flex:0 0 auto; display:block;
    box-shadow:0 0 0 2px rgba(255,255,255,0.55), 0 3px 10px rgba(0,0,0,0.25);
  }
  .brand-text{display:flex; flex-direction:column; min-width:0;}
  .brand-title h1{
    font-family:var(--font-display); font-size:1.32rem; font-weight:700; margin:0;
    letter-spacing:0.01em; color:var(--topbar-ink); line-height:1.15;
  }
  .brand-tagline{
    margin:1px 0 0; font-size:0.6rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--topbar-muted); opacity:0.85;
  }
  .live-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.68rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--topbar-muted); white-space:nowrap;
  }
  .live-dot{width:7px; height:7px; border-radius:50%; background:var(--status-confirmed); animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.45; transform:scale(0.75);}}
  .week-label{margin:6px 0 0; color:var(--topbar-muted); font-size:0.88rem; font-weight:600;}

  main{max-width:760px; margin:0 auto; padding:14px 16px 40px;}

  .week-notes{
    background:var(--accent-soft); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .week-notes-label{
    font-size:0.68rem; font-weight:800; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--accent-strong); margin:0 0 4px; display:flex; align-items:center; gap:5px;
  }
  .week-notes-label::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--accent-strong); flex:0 0 auto;}
  .week-notes p:last-child{margin:0; font-size:0.86rem; color:var(--ink); line-height:1.45;}

  .idbar{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:14px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .idbar .who{display:flex; align-items:center; gap:10px; min-width:0;}
  .avatar-circle{
    width:32px; height:32px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--brand-blue), var(--brand-navy)); color:#fff;
    font-family:var(--font-display); font-weight:700; font-size:0.9rem;
  }
  .idbar .who-name{font-family:var(--font-display); font-weight:600; font-size:1.02rem;}
  .idbar select{
    font-family:inherit; font-size:0.92rem; padding:9px 10px; border-radius:10px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink); max-width:220px;
  }
  .ghost-btn{
    background:none; border:1px solid var(--border); color:var(--ink-soft);
    padding:7px 12px; border-radius:10px; font-size:0.82rem; font-weight:600; cursor:pointer;
  }
  .ghost-btn:hover{border-color:var(--accent); color:var(--accent-strong);}

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
    font-size:0.70rem; font-weight:700; letter-spacing:0.01em; white-space:nowrap;
  }
  .role-manager{background:var(--role-manager-soft); color:var(--role-manager);}
  .role-supervisor{background:var(--role-supervisor-soft); color:var(--role-supervisor);}
  .role-retail{background:var(--role-retail-soft); color:var(--role-retail);}
  .role-online_orders{background:var(--role-online_orders-soft); color:var(--role-online_orders);}
  .status-pending{background:var(--status-pending-soft); color:var(--status-pending);}
  .status-confirmed{background:var(--status-confirmed-soft); color:var(--status-confirmed);}
  .status-open{background:var(--status-open-soft); color:var(--status-open);}

  .tabs{
    display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:12px;
    margin-bottom:16px; overflow-x:auto;
  }
  .tab-btn{
    flex:1 1 auto; white-space:nowrap; text-align:center; padding:9px 6px; border-radius:9px;
    border:none; background:transparent; color:var(--ink-soft); font-weight:700; font-size:0.76rem;
    cursor:pointer; min-width:0; transition:background 0.15s ease, color 0.15s ease;
  }
  .tab-btn.active{
    background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow);
    position:relative;
  }
  .tab-btn.active::after{
    content:''; position:absolute; left:50%; bottom:3px; transform:translateX(-50%);
    width:16px; height:3px; border-radius:999px; background:var(--accent);
  }
  .tab-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px;
    padding:0 4px; margin-left:4px; border-radius:999px; background:var(--accent); color:var(--accent-ink);
    font-size:0.62rem; font-weight:800; vertical-align:middle;
  }

  h2.section-title{
    font-family:var(--font-display); font-size:1.12rem; font-weight:700; margin:0 0 3px;
    display:flex; align-items:center; gap:8px; letter-spacing:0.01em;
  }
  h2.section-title::before{
    content:''; width:7px; height:7px; border-radius:50%; background:var(--accent); flex:0 0 auto;
  }
  p.section-sub{color:var(--muted); font-size:0.85rem; margin:0 0 14px;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:14px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .shift-card{display:flex; flex-direction:column; gap:8px;}
  .shift-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .shift-day{font-family:var(--font-display); font-weight:700; font-size:1rem;}
  .shift-date{color:var(--muted); font-size:0.78rem;}
  .shift-time{font-family:var(--font-display); font-size:1.5rem; font-weight:700; letter-spacing:0; color:var(--accent-strong);}
  .shift-meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .shift-who{font-size:0.82rem; color:var(--ink-soft);}
  .shift-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:2px;}
  .edit-request-banner{
    border-radius:10px; padding:8px 10px; margin-top:2px; display:flex; flex-direction:column; gap:7px;
  }
  .edit-request-banner p{margin:0; font-size:0.8rem; line-height:1.4;}
  .edit-request-banner .btn{align-self:flex-start;}
  .edit-request-banner.status-pending{background:var(--status-pending-soft); color:var(--status-pending);}
  .edit-request-banner.status-open{background:var(--status-open-soft); color:var(--status-open);}

  .btn{
    border:none; border-radius:999px; padding:10px 16px; font-weight:700; font-size:0.85rem;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition:transform 0.1s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:var(--glow-shadow);}
  .btn-primary:hover{background:var(--accent-strong); transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}
  .btn-danger{background:var(--status-open-soft); color:var(--status-open);}
  .btn-secondary{background:var(--surface-2); color:var(--ink);}
  .btn:disabled{opacity:0.5; cursor:not-allowed; box-shadow:none; transform:none;}

  .empty{
    text-align:center; padding:28px 16px; color:var(--muted); font-size:0.88rem;
    border:1.5px dashed var(--border); border-radius:16px; background:var(--surface);
  }

  .scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:16px; border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow);}
  table.grid{border-collapse:collapse; width:100%; min-width:620px;}
  table.grid th, table.grid td{padding:9px 8px; border-bottom:1px solid var(--border); font-size:0.78rem; text-align:center; vertical-align:middle;}
  table.grid th{background:var(--surface-2); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); font-weight:700;}
  table.grid td:first-child, table.grid th:first-child{text-align:left; position:sticky; left:0; background:var(--surface); font-weight:700; min-width:96px;}
  table.grid th:first-child{background:var(--surface-2);}
  .cell-shift{display:inline-flex; flex-direction:column; align-items:center; gap:2px; padding:5px 7px; border-radius:10px; min-width:62px; transition:transform 0.1s ease;}
  .cell-shift.clickable{cursor:pointer;}
  .cell-shift.clickable:active{opacity:0.7; transform:scale(0.96);}
  .cell-time{font-size:0.74rem; font-weight:700;}
  .cell-role{font-size:0.56rem; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; opacity:0.78; line-height:1.15; text-align:center;}
  .cell-dash{color:var(--border); font-weight:700;}
  .dot{width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:4px; vertical-align:middle;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin:2px 0 12px; font-size:0.76rem; color:var(--ink-soft);}
  .week-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .week-nav-label{text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;}
  .week-nav-label > div:first-child{font-family:var(--font-display); font-size:1rem;}
  .cell-empty{background:transparent; border:1.5px dashed var(--border); color:var(--accent); font-weight:800; min-width:36px; min-height:28px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px;}
  .cell-empty:hover{border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft);}

  fieldset{border:none; padding:0; margin:0 0 14px;}
  .avail-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--border);}
  .avail-row:last-child{border-bottom:none;}
  .avail-day{font-weight:700; font-size:0.86rem; min-width:44px;}
  .seg{display:flex; gap:4px; background:var(--surface-2); padding:3px; border-radius:9px;}
  .seg button{border:none; background:transparent; padding:6px 9px; border-radius:7px; font-size:0.72rem; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .seg button.on-available{background:var(--status-confirmed-soft); color:var(--status-confirmed);}
  .seg button.on-unavailable{background:var(--status-open-soft); color:var(--status-open);}
  .seg button.on-limited{background:var(--status-pending-soft); color:var(--status-pending);}
  .time-inputs{display:flex; gap:6px; align-items:center; margin-top:6px;}
  .time-inputs input[type=time]{font-family:inherit; padding:6px 7px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:0.8rem;}
  textarea, input[type=text], input[type=password]{
    width:100%; font-family:inherit; padding:10px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:0.88rem;
  }
  label.field-label{display:block; font-size:0.76rem; font-weight:700; color:var(--muted); margin:10px 0 5px; text-transform:uppercase; letter-spacing:0.03em;}

  .avail-summary-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .avail-summary-row:last-child{border-bottom:none;}
  .avail-name{font-weight:700; font-size:0.85rem; min-width:84px;}
  .avail-dots{display:flex; gap:5px;}
  .avail-dots .d{width:20px; height:20px; border-radius:6px; font-size:0.6rem; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .avail-note{color:var(--muted); font-size:0.78rem; width:100%; margin-top:2px;}

  .pin-box{max-width:280px; margin:24px auto; text-align:center;}
  .pin-box input{text-align:center; font-size:1.3rem; letter-spacing:0.3em; font-family:'IBM Plex Mono',monospace;}

  .mgr-shift-row{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);}
  .mgr-shift-row:last-child{border-bottom:none;}
  .mgr-shift-row .mgr-staff{flex:1 1 55%; min-width:120px;}
  .mgr-shift-row .mgr-tag{flex:1 1 40%; min-width:110px;}
  .mgr-shift-row .mgr-time{flex:1 1 auto; min-width:88px;}
  .mgr-shift-row .icon-btn{flex:0 0 auto; margin-left:auto;}
  select.inline-select, input.inline-time{
    font-family:inherit; padding:7px 8px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:0.8rem; width:100%;
  }
  .staff-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--border);}
  .staff-pin{width:70px; font-family:'IBM Plex Mono',monospace; letter-spacing:0.08em;}
  .staff-row:last-child{border-bottom:none;}
  .icon-btn{background:none; border:none; color:var(--status-open); font-size:0.78rem; font-weight:700; cursor:pointer; padding:4px 8px;}
  details.add-panel{margin-top:10px; border:1px dashed var(--border); border-radius:10px; padding:10px 12px;}
  details.add-panel summary{cursor:pointer; font-weight:700; font-size:0.85rem; color:var(--accent-strong); list-style:none;}
  details.add-panel summary::-webkit-details-marker{display:none;}
  .grid-form{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
  .grid-form .span2{grid-column:1 / -1;}
  .rate-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .rate-grid input{text-align:center; padding:8px 4px;}

  .toast-region{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; padding:0 16px; pointer-events:none;}

  .celebrate-region{position:fixed; inset:0; z-index:65; pointer-events:none; display:flex; align-items:center; justify-content:center;}
  .celebrate-pop{
    background:var(--accent); color:var(--accent-ink); padding:16px 26px; border-radius:18px;
    font-size:1.25rem; font-weight:800; box-shadow:var(--shadow); text-align:center;
    opacity:0; transform:scale(0.5); transition:opacity 0.22s ease, transform 0.22s cubic-bezier(.34,1.56,.64,1);
  }
  .celebrate-pop.show{opacity:1; transform:scale(1);}

  .confirm-overlay{position:fixed; inset:0; background:rgba(10,14,11,0.5); z-index:60; display:none; align-items:center; justify-content:center; padding:20px;}
  .confirm-overlay.show{display:flex;}
  .confirm-box{background:var(--surface); border-radius:var(--radius); padding:20px; max-width:340px; width:100%; box-shadow:var(--shadow); border:1px solid var(--border);}
  .confirm-box p{margin:0 0 16px; font-size:0.9rem; color:var(--ink); line-height:1.45;}
  .confirm-box .confirm-actions{display:flex; gap:8px; justify-content:flex-end;}
  .toast{background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:0.82rem; font-weight:600; box-shadow:var(--shadow); max-width:420px; text-align:center;}

  .detail-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); font-size:0.85rem;}
  .detail-row:last-of-type{border-bottom:none;}
  .detail-row .k{color:var(--muted); font-size:0.76rem; text-transform:uppercase; letter-spacing:0.03em; font-weight:700;}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .detail-actions a.btn{text-decoration:none;}
  .request-preview{
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:0.82rem; line-height:1.5; color:var(--ink); max-height:240px; overflow-y:auto;
  }

  .footnote{color:var(--muted); font-size:0.72rem; text-align:center; margin-top:18px; line-height:1.5;}
</style>

<script>
// Where the roster's data lives (the Google Apps Script web app). Used when
// this page is hosted outside Google, so Google sign-ins never get in the way.
var API_URL = "https://script.google.com/macros/s/AKfycbxzkHlp6YJwf0GEbU2q6LPDwwBZ1Y3QHdh0eCiTgBMCeUy6gz6pzI30poD9WjoVeYbF/exec";

<script>function App(){
"use strict";

// The page is served by Google Apps Script with the current roster embedded
// (PINs, phone numbers and pay rates are stripped out for everyone except an
// unlocked admin). All saving goes back through the server, which checks the
// PIN, applies the change to the latest copy, and returns the new roster.
var BOOT = JSON.parse(document.getElementById('state-data').textContent);
var STATE = BOOT.state;
var VERSION = BOOT.version;
function normalizeState(st){
  st.timeOff = st.timeOff || [];
  st.availability = st.availability || {};
  st.currency = st.currency || '£';
  // Optional free-text notice for the current week only, shown to everyone
  // right under the header. Admin-only to edit (Admin tab); blank hides it.
  st.weekNotes = typeof st.weekNotes === 'string' ? st.weekNotes : '';
  // Archive of non-active weeks, keyed by that week's Monday ISO date — holds
  // both history (snapshotted when a week is rolled past) and pre-planned
  // future weeks (shifts an admin added ahead of time via the grid, before
  // that week is officially started). The currently active week always lives
  // at the top level (STATE.days/STATE.shifts/STATE.weekLabel), unchanged.
  st.weeks = st.weeks || {};
  st.roleInfo = st.roleInfo || {};
  st.staff.forEach(normalizeRates);
  return st;
}
// Rates are split by day-type since pay differs on weekdays vs Saturday vs
// Sunday. Normalize here (and migrate any old single "rate" field) so every
// staff member always has a full rates object to work with.
function normalizeRates(s){
  var legacy = (typeof s.rate === 'number') ? s.rate : (parseFloat(s.rate) || 0);
  var r = s.rates || {};
  s.rates = {
    weekday: typeof r.weekday === 'number' ? r.weekday : (parseFloat(r.weekday) || legacy || 0),
    sat: typeof r.sat === 'number' ? r.sat : (parseFloat(r.sat) || legacy || 0),
    sun: typeof r.sun === 'number' ? r.sun : (parseFloat(r.sun) || legacy || 0)
  };
  delete s.rate;
  if(typeof s.phone !== 'string') s.phone = s.phone || '';
  if(typeof s.email !== 'string') s.email = s.email || '';
}
normalizeState(STATE);
// The last roster the server confirmed. If a save fails, STATE is rolled
// back to this so the screen never shows a change that didn't really save.
var SAVED_STATE_JSON = JSON.stringify(STATE);
function dayType(dayKey){ return dayKey==='sat' ? 'sat' : dayKey==='sun' ? 'sun' : 'weekday'; }
var DAY_TYPE_LABEL = {weekday:'Weekday', sat:'Saturday', sun:'Sunday'};
// The public link to this roster, used to build notify messages.
var ROSTER_LINK = BOOT.url || (location.origin + location.pathname);
var ui = { tab: 'my', me: null, myPin: null, adminPin: null, mgrUnlocked: false, mgrDraft: null, mgrDraftBase: null, weekView: null, cellCtx: null };

try { ui.me = localStorage.getItem('roster_me_v1') || null; ui.myPin = localStorage.getItem('roster_pin_v1') || null; } catch(e){}
if(!ui.me || !ui.myPin || !staffByIdRaw(ui.me)){ ui.me = null; ui.myPin = null; }
try { ui.tab = sessionStorage.getItem('roster_tab_v1') || 'my'; } catch(e){}
try { ui.adminPin = sessionStorage.getItem('roster_admin_pin_v1') || null; } catch(e){}
try { ui.weekView = sessionStorage.getItem('roster_weekview_v1') || null; } catch(e){}
function staffByIdRaw(id){ return STATE.staff.find(function(s){ return s.id===id; }) || null; }

// ---------- talking to the server (Google Apps Script) ----------
function server(fn, args){
  if(window.google && google.script && google.script.run){
    return new Promise(function(resolve, reject){
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[fn].apply(runner, args || []);
    });
  }
  return callApi(fn, args);
}
// Take a roster the server sent back as the new truth.
function applyServer(res){
  if(!res || !res.state) return;
  STATE = normalizeState(res.state);
  VERSION = res.version;
  SAVED_STATE_JSON = JSON.stringify(STATE);
  if(ui.me && !staffByIdRaw(ui.me)){ logoutStaff(); }
  // An admin edit panel with no unsaved edits is rebuilt from the fresh
  // roster so it never shows stale times; one with edits is kept and merged
  // on save.
  if(ui.mgrDraft && JSON.stringify(ui.mgrDraft) === ui.mgrDraftOrig){ ui.mgrDraft = null; ui.mgrDraftBase = null; }
  render();
}
function logoutStaff(){
  ui.me = null; ui.myPin = null; ui._availDraft = null;
  try{ localStorage.removeItem('roster_me_v1'); localStorage.removeItem('roster_pin_v1'); }catch(e){}
}
function lockAdmin(){
  ui.adminPin = null; ui.mgrUnlocked = false; ui.mgrDraft = null; ui.mgrDraftBase = null;
  try{ sessionStorage.removeItem('roster_admin_pin_v1'); }catch(e){}
}
// Re-check a remembered admin PIN on load (the page itself never contains
// the admin PIN or anyone's staff PIN).
if(ui.adminPin){
  var rememberedPin = ui.adminPin;
  ui.adminPin = null;
  server('getAdminState', [rememberedPin]).then(function(res){
    if(res && res.ok){ ui.adminPin = rememberedPin; ui.mgrUnlocked = true; applyServer(res); }
    else { lockAdmin(); render(); }
  }, function(){ lockAdmin(); });
}

// Every 30s (and whenever the page comes back into view) pick up changes
// other people have saved — skipped while someone is typing or has a
// pop-up open so their screen isn't redrawn under them.
var pollBusy = false;
function pollTick(){
  if(pollBusy || document.hidden) return;
  var a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if(document.querySelector('.confirm-overlay.show')) return;
  pollBusy = true;
  server('getStateIfChanged', [VERSION, ui.adminPin || '']).then(function(res){
    pollBusy = false;
    if(res && res.state && res.version !== VERSION) applyServer(res);
  }, function(){ pollBusy = false; });
}
function startPolling(){
  setInterval(pollTick, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) pollTick(); });
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

var ROLE_ORDER = ['manager', 'supervisor', 'retail', 'online_orders'];
var ROLE_LABELS = {manager:'Manager', supervisor:'Shift Supervisor', retail:'Retail Assistant', online_orders:'Online Orders Assistant'};
function roleLabel(r){ return ROLE_LABELS[r] || r; }
function roleClass(r){ return 'role-' + r; }
// A shift's role is the role the staff member is covering for that specific
// shift — normally their usual role, but admin can set it differently when
// someone is covering a different role for a shift. Falls back to the
// assigned staff member's usual role for any shift saved before this field
// existed.
function shiftRole(shift){
  if(shift.role && ROLE_LABELS[shift.role]) return shift.role;
  var owner = staffById(shift.staffId || shift.originalStaffId);
  return (owner && owner.role) || ROLE_ORDER[0];
}

// Each entry's first line is the role's one-line summary, the last line is
// "Reports to: ..." (rendered as its own section, not a bullet), and every
// line in between is a responsibility, one per line. Editable by the admin
// from the Admin tab and shown to everyone on the Roles tab.
var DEFAULT_ROLE_INFO = {
  manager: "Runs the store day-to-day and carries final responsibility for the team and how the shop performs.\nOpen and/or close the store; hold keys and alarm codes\nHandle cash management: float, change, and end-of-day reconciliation\nResolve escalated customer issues and complaints\nRespond to customer enquiries\nLook after corporate and wholesale customers\nManage stock ordering, deliveries, stock takes and inventory\nTrain, manage and oversee the team's day-to-day operations\nSet task lists for team members\nEnsure store presentation standards are met and the shop looks neat and organised\nOversee online orders and emails\nHave final say on tasks, customer-related decisions and promotions\nReports to: Hursh",
  supervisor: "Runs the shop floor on shift and is the go-to for the team when the Manager isn't on-site.\nOpen or close the store on shifts tagged accordingly (cashing up, alarm, locking up)\nKeep the shop floor running smoothly: serving customers quickly, preparing balloon orders on time, putting out and updating stock\nFirst point of contact for anything a Retail Assistant can't resolve\nApprove bonds, refunds or custom sales\nKeep stock on the shop floor topped up and presentable\nFlag availability conflicts, stock issues or incidents to the Manager\nHelp onboard and train new team members on shift\nAuthorise returns and refunds within store policy\nMaintain a high level of customer service\nAttend to email enquiries\nKeep aside online shipping orders and fulfil online pick-up orders\nCheck and line up orders for the week or next day\nComplete and manage vinyl orders, making sure they're done on time\nReports to: Manager first, then Hursh if needed",
  retail: "Front-of-house: the face of the store for customers on the shop floor and at the till.\nServe customers at the till and on the shop floor; process sales and returns with Shift Supervisor approval\nKeep the shop floor, shelves and displays tidy and well stocked — pull forward and neaten all stock\nStock up balloon weights, balloons, cake boxes, boards and other extra stock from out back or above\nUnpack deliveries and get new stock out onto the floor; update inventory as needed\nAnswer product questions and give good customer service\nInflate balloons and prepare balloon orders\nSweep, spray and wipe at the end of the day; take out the bins\nReports to: Shift Supervisor, then Manager. Only escalate to Hursh if neither can resolve it.",
  online_orders: "Handles and fulfils the store's online orders.\nPick and pack online orders accurately and on time\nPrint labels and prepare parcels for courier collection or drop-off\nKeep online stock levels in sync with what's actually in-store\nProcess online returns and exchanges\nHandle customer queries about online orders — dispatch times, tracking, issues\nFlag stock discrepancies between online and in-store inventory\nHelp on the shop floor when required\nAnswer and manage email enquiries\nLiaise with staff members about enquiries or online orders\nKeep the online order bench and computer area clean and organised\nComplete and manage vinyl orders, making sure they're done on time\nReports to: Manager, then Hursh"
};
STATE.roleInfo = STATE.roleInfo || {};
ROLE_ORDER.forEach(function(r){ if(typeof STATE.roleInfo[r] !== 'string') STATE.roleInfo[r] = DEFAULT_ROLE_INFO[r]; });
function staffById(id){ return STATE.staff.find(function(s){ return s.id === id; }); }
function dayByKey(k){ return STATE.days.find(function(d){ return d.key === k; }); }
function fmtTime(t){
  if(!t) return '';
  var p = t.split(':'); var h = parseInt(p[0],10); var m = p[1];
  var ap = h >= 12 ? 'pm' : 'am'; var h12 = h % 12; if(h12===0) h12 = 12;
  return h12 + (m==='00' ? '' : ':' + m) + ap;
}
function shiftsForStaff(id){
  return STATE.shifts.filter(function(s){ return s.staffId === id; })
    .sort(function(a,b){ return dayIndex(a.day) - dayIndex(b.day); });
}
function dayIndex(k){ return STATE.days.findIndex(function(d){ return d.key===k; }); }
function openShifts(){
  return STATE.shifts.filter(function(s){ return s.status==='open'; })
    .sort(function(a,b){ return dayIndex(a.day) - dayIndex(b.day); });
}
// A staff member's own in-progress request to change their shift's time
// (e.g. picking up an extra hour). Lives on the shift itself as
// editRequest:{start,end,note,status}, status 'pending' until an admin
// approves it (applied straight to the shift, then cleared) or rejects it
// (kept as 'rejected' so the staff member sees it was declined, until they
// dismiss it). Never carries into a new week -- "Start new week" rebuilds
// fresh shift objects without this field.
function pendingEditRequests(){
  return STATE.shifts.filter(function(s){ return s.editRequest && s.editRequest.status==='pending'; });
}
function shiftHours(s){
  var sp = s.start.split(':'); var ep = s.end.split(':');
  var mins = (parseInt(ep[0],10)*60+parseInt(ep[1],10)) - (parseInt(sp[0],10)*60+parseInt(sp[1],10));
  if(mins < 0) mins += 24*60;
  return mins/60;
}
function fmtHours(n){
  var r = Math.round(n*100)/100;
  return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(2)) + 'h';
}
function fmtMoney(n){
  var cur = STATE.currency || '£';
  return cur + (Math.round((n||0)*100)/100).toFixed(2);
}

// ---------- week rollover helpers ----------
var WEEKDAY_ABBR = ['sun','mon','tue','wed','thu','fri','sat'];
var WEEKDAY_LABEL = {sun:'Sun', mon:'Mon', tue:'Tue', wed:'Wed', thu:'Thu', fri:'Fri', sat:'Sat'};
var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function isoOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function addDaysISO(iso, n){
  var d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return isoOf(d);
}
function buildDays(startISO){
  var start = new Date(startISO + 'T00:00:00');
  var days = [];
  for(var i=0;i<7;i++){
    var d = new Date(start.getTime() + i*86400000);
    var key = WEEKDAY_ABBR[d.getDay()];
    days.push({ key: key, label: WEEKDAY_LABEL[key], date: d.getDate() + ' ' + MONTH_ABBR[d.getMonth()], iso: isoOf(d) });
  }
  return days;
}
function formatWeekLabel(days){
  var first = new Date(days[0].iso + 'T00:00:00');
  var last = new Date(days[6].iso + 'T00:00:00');
  if(first.getFullYear() === last.getFullYear()){
    if(first.getMonth() === last.getMonth()){
      return first.getDate() + ' – ' + last.getDate() + ' ' + MONTH_FULL[last.getMonth()] + ' ' + last.getFullYear();
    }
    return first.getDate() + ' ' + MONTH_ABBR[first.getMonth()] + ' – ' + last.getDate() + ' ' + MONTH_ABBR[last.getMonth()] + ' ' + last.getFullYear();
  }
  return first.getDate() + ' ' + MONTH_ABBR[first.getMonth()] + ' ' + first.getFullYear() + ' – ' + last.getDate() + ' ' + MONTH_ABBR[last.getMonth()] + ' ' + last.getFullYear();
}
function todayISO(){ return isoOf(new Date()); }
function fmtDateDisplay(iso){
  if(!iso) return '';
  var d = new Date(iso + 'T00:00:00');
  return d.getDate() + ' ' + MONTH_ABBR[d.getMonth()] + ' ' + d.getFullYear();
}

function toast(msg){
  var region = document.getElementById('toastRegion');
  var el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  region.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3600);
}

// A bigger, celebratory pop — separate from the routine toast — used for
// moments worth making a fuss over, like accepting a shift.
function celebrate(msg){
  var region = document.getElementById('celebrateRegion');
  if(!region) return;
  var el = document.createElement('div');
  el.className = 'celebrate-pop'; el.textContent = msg;
  region.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){ el.remove(); }, 250);
  }, 1500);
}

// Custom confirm dialog: artifacts run in a sandboxed frame where the
// native window.confirm() is blocked (it silently no-ops), so a real
// in-page modal is used instead for any destructive action.
var pendingConfirmAction = null;
function showConfirm(message, onConfirm){
  pendingConfirmAction = onConfirm;
  document.getElementById('confirmText').textContent = message;
  document.getElementById('confirmOverlay').classList.add('show');
}
function hideConfirm(){
  document.getElementById('confirmOverlay').classList.remove('show');
  pendingConfirmAction = null;
}

// Cell modal: opened by tapping any square on the Full Week grid, filled or
// empty. Shows the shift's info plus whatever the current viewer can do with
// it — a staff member can accept/decline/claim their own shifts on the live
// week; an admin can additionally add, edit, or remove any shift on any
// week (used to pre-plan future weeks or correct past/current ones).
function findShiftInWeek(weekKey, dayKey, staffId){
  var arr = weekShiftsReadOnly(weekKey);
  return arr.find(function(s){ return s.staffId===staffId && s.day===dayKey; }) ||
         arr.find(function(s){ return s.originalStaffId===staffId && s.day===dayKey && s.status==='open'; });
}
function openCellModal(weekKey, dayKey, staffId){
  ui.cellCtx = {weekKey:weekKey, dayKey:dayKey, staffId:staffId};
  var shift = findShiftInWeek(weekKey, dayKey, staffId);
  if(!shift && !ui.mgrUnlocked) return; // nothing to show a non-admin for an empty cell
  var html = (!shift && ui.mgrUnlocked) ? cellEditFormHTML(ui.cellCtx, null) : cellViewHTML(ui.cellCtx, shift);
  document.getElementById('detailBox').innerHTML = html;
  document.getElementById('detailOverlay').classList.add('show');
}
function hideDetail(){
  document.getElementById('detailOverlay').classList.remove('show');
  ui.cellCtx = null;
}
function cellViewHTML(ctx, shift){
  var day = weekDaysFor(ctx.weekKey).find(function(d){ return d.key===ctx.dayKey; });
  var st = statusInfo(shift);
  var assignee = shift.staffId ? staffById(shift.staffId) : null;
  var original = shift.originalStaffId ? staffById(shift.originalStaffId) : null;
  var isActiveWeek = ctx.weekKey === weekStartKey();
  var conflict = isActiveWeek ? availabilityConflict(shift) : null;
  var html = '<div class="detail-row"><span class="k">Day</span><span>' + day.label + ' ' + day.date + '</span></div>' +
    '<div class="detail-row"><span class="k">Time</span><span class="mono">' + fmtTime(shift.start) + ' – ' + fmtTime(shift.end) + '</span></div>' +
    '<div class="detail-row"><span class="k">Status</span><span class="badge ' + st.cls + '">' + st.label + '</span></div>' +
    '<div class="detail-row"><span class="k">Role this shift</span><span class="badge ' + roleClass(shiftRole(shift)) + '">' + roleLabel(shiftRole(shift)) + '</span></div>' +
    '<div class="detail-row"><span class="k">Assigned to</span><span>' + (assignee ? esc(assignee.name) + ' · ' + roleLabel(assignee.role) : (original ? 'Open (released by ' + esc(original.name) + ')' : 'Open')) + '</span></div>';
  if(conflict) html += '<div class="detail-row" style="color:var(--status-open); border-bottom:none;">⚠ ' + esc(conflict.reason) + '</div>';
  var actions = '';
  if(isActiveWeek && ui.me && shift.staffId===ui.me && shift.status==='pending'){
    actions += '<button class="btn btn-primary" data-action="detail-accept" data-shift="' + shift.id + '">Accept shift</button>' +
      '<button class="btn btn-danger" data-action="detail-release" data-shift="' + shift.id + '">Can\'t do it</button>';
  } else if(isActiveWeek && ui.me && shift.staffId===ui.me && shift.status==='confirmed'){
    actions += '<button class="btn btn-secondary" data-action="detail-release" data-shift="' + shift.id + '">Release this shift</button>';
  } else if(isActiveWeek && shift.status==='open'){
    if(ui.me) actions += '<button class="btn btn-primary" data-action="detail-claim" data-shift="' + shift.id + '">Claim this shift</button>';
    else actions += '<p class="section-sub" style="margin:0;">Select your name above to claim this shift.</p>';
  }
  if(ui.mgrUnlocked){
    actions += '<button class="btn btn-secondary" data-action="cell-edit-start">Edit shift</button>' +
      '<button class="btn btn-danger" data-action="cell-remove">Remove shift</button>';
  }
  return html + '<div class="detail-actions">' + actions + '<button class="btn btn-secondary" data-action="close-detail">Close</button></div>';
}
function cellEditFormHTML(ctx, shift){
  var day = weekDaysFor(ctx.weekKey).find(function(d){ return d.key===ctx.dayKey; });
  var staff = staffById(ctx.staffId);
  var roleVal = shift ? shiftRole(shift) : ((staff && staff.role) || ROLE_ORDER[0]);
  return '<div class="detail-row"><span class="k">For</span><span>' + esc(staff ? staff.name : '') + '</span></div>' +
    '<div class="detail-row"><span class="k">Day</span><span>' + day.label + ' ' + day.date + '</span></div>' +
    '<label class="field-label" style="margin-top:10px;">Start</label>' +
    '<input type="time" id="cellStart" value="' + (shift ? shift.start : '09:00') + '">' +
    '<label class="field-label">End</label>' +
    '<input type="time" id="cellEnd" value="' + (shift ? shift.end : '17:00') + '">' +
    '<label class="field-label">Role this shift</label>' +
    '<select class="inline-select" id="cellRole">' +
      ROLE_ORDER.map(function(r){ return '<option value="' + r + '"' + (roleVal===r ? ' selected' : '') + '>' + roleLabel(r) + '</option>'; }).join('') +
    '</select>' +
    '<div class="detail-actions">' +
      '<button class="btn btn-primary" data-action="cell-save">' + (shift ? 'Save &amp; publish' : 'Add &amp; publish') + '</button>' +
      (shift ? '<button class="btn btn-danger" data-action="cell-remove">Remove shift</button>' : '') +
      '<button class="btn btn-secondary" data-action="close-detail">Cancel</button>' +
    '</div>';
}

// ---------- week browsing helpers (the active week always lives at the top
// level of STATE; any other week being viewed or pre-planned is read from
// / written into the STATE.weeks archive) ----------
function weekStartKey(){ return STATE.days[0].iso; }
function weekShiftsReadOnly(weekKey){
  if(weekKey === weekStartKey()) return STATE.shifts;
  var w = STATE.weeks[weekKey];
  return w ? w.shifts : [];
}
function weekDaysFor(weekKey){
  if(weekKey === weekStartKey()) return STATE.days;
  var w = STATE.weeks[weekKey];
  return w ? w.days : buildDays(weekKey);
}
function weekLabelFor(weekKey){
  if(weekKey === weekStartKey()) return STATE.weekLabel;
  var w = STATE.weeks[weekKey];
  return w ? w.weekLabel : formatWeekLabel(buildDays(weekKey));
}
function resolveViewedWeek(){
  var key = ui.weekView || weekStartKey();
  return {
    key: key,
    days: weekDaysFor(key),
    shifts: weekShiftsReadOnly(key),
    weekLabel: weekLabelFor(key),
    isActive: key === weekStartKey()
  };
}
// Returns a live, mutable shifts array for the given week, creating an
// archive entry first if that week has no data yet (used only when saving
// an edit — never for read-only rendering).
function getWeekShiftsArray(weekKey){
  if(weekKey === weekStartKey()) return STATE.shifts;
  var w = STATE.weeks[weekKey];
  if(!w){
    var days = buildDays(weekKey);
    w = STATE.weeks[weekKey] = { weekLabel: formatWeekLabel(days), days: days, shifts: [] };
  }
  return w.shifts;
}
function setWeekShiftsArray(weekKey, newArr){
  if(weekKey === weekStartKey()){ STATE.shifts = newArr; return; }
  var w = STATE.weeks[weekKey];
  if(!w){
    var days = buildDays(weekKey);
    w = STATE.weeks[weekKey] = { weekLabel: formatWeekLabel(days), days: days, shifts: [] };
  }
  w.shifts = newArr;
}

// ---------- saving ----------
// Staff changes (accept / release / claim / availability / time off / shift
// change requests) are sent as a small named action. The server re-checks
// the PIN, applies it to the latest roster (so two people saving at once
// never overwrite each other) and returns the updated roster.
// opts.request: plain-text version of the change, offered as a WhatsApp /
// text fallback if the server can't be reached.
// opts.onSuccess: run only once the change has really been saved.
function staffSave(action, payload, successMsg, opts){
  opts = opts || {};
  if(!ui.me || !ui.myPin){ revertUnsaved(); toast('Select your name and enter your PIN first.'); return; }
  setSaving(true);
  server('staffAction', [ui.me, ui.myPin, action, payload, ui.adminPin || '']).then(function(res){
    setSaving(false);
    if(res && res.ok){
      applyServer(res);
      if(successMsg) toast(successMsg);
      if(opts.onSuccess) opts.onSuccess();
      return;
    }
    if(res && res.error === 'bad_pin'){
      logoutStaff(); revertUnsaved();
      toast('Your PIN has changed — please log in again.');
      return;
    }
    if(res && res.state) applyServer(res); else revertUnsaved();
    toast((res && res.message) || 'That didn\'t save. Please try again.');
  }, function(){
    setSaving(false);
    revertUnsaved();
    if(opts.request) showSendToAdmin(opts.request, true);
    else toast('Couldn\'t reach the roster — check your connection and try again.');
  });
}
// Admin changes: run `mutate` (which edits STATE directly) on top of the last
// saved roster and save the whole roster. If someone else saved in between,
// the server says so and the same change is re-applied on top of theirs, so
// nothing anyone else did is lost.
function adminCommit(mutate, successMsg, opts){
  opts = opts || {};
  if(!ui.adminPin){ toast('Unlock Admin first.'); revertUnsaved(); return; }
  var tries = 0;
  function attempt(baseJson, baseVersion){
    STATE = normalizeState(JSON.parse(baseJson));
    mutate();
    var next = STATE;
    render();
    setSaving(true);
    server('saveAdminState', [ui.adminPin, next, baseVersion]).then(function(res){
      setSaving(false);
      if(res && res.error === 'bad_pin'){ lockAdmin(); revertUnsaved(); toast('Admin PIN not accepted — unlock Admin again.'); return; }
      if(res && res.conflict){
        if(++tries < 4){ attempt(JSON.stringify(res.state), res.version); return; }
        applyServer(res); toast('The roster kept changing — please try that again.'); return;
      }
      if(res && res.ok){
        applyServer(res);
        if(successMsg) toast(successMsg);
        if(opts.onSuccess) opts.onSuccess();
        return;
      }
      revertUnsaved();
      toast((res && res.message) || 'That didn\'t save. Please try again.');
    }, function(){
      setSaving(false);
      revertUnsaved();
      toast('Couldn\'t reach the roster — check your connection and try again.');
    });
  }
  attempt(SAVED_STATE_JSON, VERSION);
}
var savingCount = 0;
function setSaving(on){
  savingCount = Math.max(0, savingCount + (on ? 1 : -1));
  var pill = document.querySelector('.live-pill');
  if(pill) pill.lastChild.textContent = savingCount ? 'Saving…' : 'Live';
}
function revertUnsaved(){
  STATE = normalizeState(JSON.parse(SAVED_STATE_JSON));
  ui._availDraft = null;
  render();
}

    '<div class="request-preview">' + esc(text).replace(/\n/g, '<br>') + '</div>' +
    '<div class="detail-actions">' +
      '<a class="btn btn-primary" href="https://wa.me/?text=' + encoded + '" target="_blank" rel="noopener">WhatsApp</a>' +
      '<a class="btn btn-secondary" href="sms:?&body=' + encoded + '">Text message</a>' +
      '<button class="btn btn-secondary" data-action="copy-request">Copy</button>' +
      '<button class="btn btn-secondary" data-action="close-detail">Close</button>' +
    '</div>';
  document.getElementById('detailBox').innerHTML = html;
  document.getElementById('detailOverlay').classList.add('show');
}

function shiftDesc(s){
  var d = dayByKey(s.day);
  return d.label + ' ' + d.date + ' (' + fmtTime(s.start) + '–' + fmtTime(s.end) + ')';
}
function availabilityRequestText(rec){
  var lines = ['Hi, it\'s ' + staffNameMe() + ' — my availability for ' + STATE.weekLabel + ':'];
  STATE.days.forEach(function(d){
    var r = rec.days[d.key] || {status:'available'};
    var txt = r.status==='available' ? 'Available' : r.status==='unavailable' ? 'Unavailable' : 'Limited ' + fmtTime(r.from||'09:00') + '–' + fmtTime(r.to||'17:00');
    lines.push(d.label + ' ' + d.date + ': ' + txt);
  });
  if(rec.note) lines.push('Note: ' + rec.note);
  return lines.join('\n');
}

  if(!notes) return '';

function renderIdentityBar(){
  var me = ui.me ? staffById(ui.me) : null;
  var options = '<option value="">Select your name…</option>';
  ROLE_ORDER.forEach(function(role){
    var group = STATE.staff.filter(function(s){ return s.role===role; });

    options += '<optgroup label="' + roleLabel(role) + '">';
    group.forEach(function(s){
      options += '<option value="' + s.id + '"' + (me && me.id===s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>';
    });

  });

      '<span class="who-name">Hi, ' + esc(me.name) + '</span>' +

      '</div><button class="ghost-btn" data-action="switch-id">Switch</button></div>';

  return '<div class="idbar" style="flex-direction:column; align-items:stretch;">' +
    '<label class="field-label" style="margin-top:0;">Who are you?</label>' +
    '<select id="idSelect">' + options + '</select>' +
    '<label class="field-label">PIN</label>' +
    '<input type="password" inputmode="numeric" pattern="[0-9]*" id="idPin" placeholder="••••" maxlength="8">' +

  {key:'avail', label:'Availability'},
  {key:'roles', label:'Roles'},
  {key:'mgr', label:'Admin'},

function renderTabs(){
  var pendingCount = ui.mgrUnlocked ? pendingEditRequests().length : 0;
  return '<nav class="tabs">' + TABS.filter(function(t){ return t.key!=='budget' || ui.mgrUnlocked; }).map(function(t){
    var label = esc(t.label);

function renderTabContent(){
  if(ui.tab==='my') return renderMyShifts();
  if(ui.tab==='week') return renderFullWeek();
  if(ui.tab==='avail') return ui._availDraft ? renderAvailabilityFromDraft() : renderAvailability();

var REPORTS_TO_PREFIX = /^reports?\s*to\s*:\s*/i;
function roleInfoParts(text){
  var lines = (text||'').split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return l.length; });
  var reportsTo = '';
  var rest = lines.slice(1);
  // A "Reports to: ..." line is pulled out of the bullets (wherever it is,
  // though it's normally last) and shown as its own section instead.
  for(var i=rest.length-1; i>=0; i--){
    if(REPORTS_TO_PREFIX.test(rest[i])){
      reportsTo = rest[i].replace(REPORTS_TO_PREFIX, '');
      rest.splice(i, 1);
      break;
    }
  }
  return { summary: lines[0] || '', bullets: rest, reportsTo: reportsTo };
}
function renderRoles(){
  var out = '<h2 class="section-title">Roles &amp; responsibilities</h2>' +
    '<p class="section-sub">What each role on the team covers. Admin can update this from the Admin tab.</p>';
  ROLE_ORDER.forEach(function(r){
    var parts = roleInfoParts(STATE.roleInfo[r]);
    out += '<div class="card">' +
      '<span class="badge ' + roleClass(r) + '">' + roleLabel(r) + '</span>' +
      (parts.summary ? '<p style="margin:10px 0 8px; font-size:0.88rem; color:var(--ink-soft);">' + esc(parts.summary) + '</p>' : '');
    if(parts.bullets.length){
      out += '<ul style="margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px;">' +
        parts.bullets.map(function(b){ return '<li style="font-size:0.85rem;">' + esc(b) + '</li>'; }).join('') +
      '</ul>';
    }
    if(parts.reportsTo){
      out += '<div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--border); display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;">' +
        '<span class="field-label" style="margin:0;">Reports to</span>' +
        '<span style="font-size:0.85rem; font-weight:600;">' + esc(parts.reportsTo) + '</span>' +
      '</div>';
    }
    out += '</div>';
  });
  return out;
}

// Returns null if a shift doesn't conflict with what its assigned staff
// member has said about that day, or {level, reason} if it does.
// level 'blocked' = marked fully unavailable; 'partial' = outside the
// hours they said they're limited to.
function availabilityConflict(shift){
  if(!shift.staffId) return null;
  var rec = STATE.availability[shift.staffId];
  if(!rec) return null;
  var day = rec.days[shift.day];
  if(!day || day.status==='available') return null;
  if(day.status==='unavailable'){
    return {level:'blocked', reason:'Marked themselves unavailable this day'};
  }
  if(day.status==='limited'){
    var from = day.from || '00:00', to = day.to || '23:59';
    if(shift.start < from || shift.end > to){
      return {level:'partial', reason:'Said they\'re only free ' + fmtTime(from) + '–' + fmtTime(to) + ' this day'};
    }
  }
  return null;
}
function conflictBadgeHTML(conflict){
  if(!conflict) return '';
  return '<span class="badge status-open" title="' + esc(conflict.reason) + '">⚠ ' + (conflict.level==='blocked' ? 'Availability conflict' : 'Outside stated hours') + '</span>';
}
function renderConflictsOverview(){
  var rows = [];
  STATE.shifts.forEach(function(s){
    if(s.status==='open') return;
    var c = availabilityConflict(s);
    if(c) rows.push({shift:s, conflict:c});
  });
  if(!rows.length){
    return '<div class="empty" style="margin-top:14px;">No conflicts — every allocated shift matches what people said they\'re available for.</div>';
  }
  rows.sort(function(a,b){ return dayIndex(a.shift.day) - dayIndex(b.shift.day); });
  var out = '<div class="card" style="margin-top:14px; border-color:var(--status-open);">' +
    '<h2 class="section-title" style="font-size:0.9rem; color:var(--status-open);">⚠ ' + rows.length + ' shift' + (rows.length===1?'':'s') + ' conflict' + (rows.length===1?'s':'') + ' with stated availability</h2>';
  rows.forEach(function(r){
    var s = r.shift; var staff = staffById(s.staffId); var day = dayByKey(s.day);
    out += '<div class="avail-summary-row"><div style="flex:1 1 auto;">' +
      '<div style="font-weight:700; font-size:0.85rem;">' + esc(staff ? staff.name : 'Unknown') + ' · ' + day.label + ' ' + day.date + '</div>' +
      '<div style="font-size:0.8rem; color:var(--ink-soft); margin-top:2px;" class="mono">' + fmtTime(s.start) + ' – ' + fmtTime(s.end) + '</div>' +
      '<div style="font-size:0.78rem; color:var(--status-open); margin-top:2px;">' + esc(r.conflict.reason) + '</div>' +
    '</div></div>';
  });
  out += '</div>';
  return out;
}

function statusInfo(shift){
  if(shift.status==='confirmed') return {cls:'status-confirmed', label:'Confirmed'};
  if(shift.status==='open') return {cls:'status-open', label:'Needs coverage'};
  return {cls:'status-pending', label:'Awaiting response'};
}
function cellStatusStyle(status){
  if(status==='confirmed') return {bg:'var(--status-confirmed-soft)', fg:'var(--status-confirmed)'};
  if(status==='open') return {bg:'var(--status-open-soft)', fg:'var(--status-open)'};
  return {bg:'var(--status-pending-soft)', fg:'var(--status-pending)'};
}

function shiftRoleBadge(shift){
  var r = shiftRole(shift);
  return '<span class="badge ' + roleClass(r) + '">' + roleLabel(r) + '</span>';
}

function shiftCardHTML(shift, opts){
  opts = opts || {};
  var day = dayByKey(shift.day);
  var st = statusInfo(shift);
  var assignee = shift.staffId ? staffById(shift.staffId) : null;
  var original = shift.originalStaffId ? staffById(shift.originalStaffId) : null;
  var whoLine = '';
  if(opts.showWho){
    if(assignee) whoLine = '<div class="shift-who">' + esc(assignee.name) + ' · ' + roleLabel(assignee.role) + '</div>';
    else if(original) whoLine = '<div class="shift-who">Released by ' + esc(original.name) + ' — open for pickup</div>';
  }
  var actions = '';
  if(opts.mineActions){
    if(shift.status==='pending'){
      actions = '<div class="shift-actions">' +
        '<button class="btn btn-primary" data-action="accept" data-shift="' + shift.id + '">Accept shift</button>' +
        '<button class="btn btn-danger" data-action="release" data-shift="' + shift.id + '">Can\'t do it</button>' +
      '</div>';
    } else if(shift.status==='confirmed'){
      actions = '<div class="shift-actions">' +
        '<button class="btn btn-secondary" data-action="release" data-shift="' + shift.id + '">Release this shift</button>' +
      '</div>';
    }
    actions += editRequestActionsHTML(shift);
  }
  if(opts.claimAction && shift.status==='open'){
    actions = '<div class="shift-actions"><button class="btn btn-primary" data-action="claim" data-shift="' + shift.id + '">Claim this shift</button></div>';
  }
  var conflictLine = '';
  if(opts.mineActions){
    var myConflict = availabilityConflict(shift);
    if(myConflict) conflictLine = '<div class="shift-meta" style="margin-top:2px;">' + conflictBadgeHTML(myConflict) + '</div>';
  }
  return '<div class="card shift-card">' +
    '<div class="shift-top">' +
      '<div><div class="shift-day">' + day.label + '</div><div class="shift-date mono">' + day.date + '</div></div>' +
      '<span class="badge ' + st.cls + '">' + st.label + '</span>' +
    '</div>' +
    '<div class="shift-time mono">' + fmtTime(shift.start) + ' – ' + fmtTime(shift.end) + '</div>' +
    '<div class="shift-meta">' + shiftRoleBadge(shift) + '</div>' +
    conflictLine + whoLine + actions +
  '</div>';
}

// Staff-facing: either the "ask to change this shift" button, or -- while a
// request is outstanding -- a banner showing what was asked for and letting
// them cancel (pending) or dismiss (rejected) it.
function editRequestActionsHTML(shift){
  var req = shift.editRequest;
  if(req && req.status==='pending'){
    return '<div class="edit-request-banner status-pending">' +
      '<p>Change requested: <span class="mono">' + fmtTime(req.start) + '–' + fmtTime(req.end) + '</span>' +
        (req.note ? ' — "' + esc(req.note) + '"' : '') + '. Waiting on admin approval.</p>' +
      '<button class="btn btn-secondary" data-action="cancel-edit-request" data-shift="' + shift.id + '">Cancel request</button>' +
    '</div>';
  }
  if(req && req.status==='rejected'){
    return '<div class="edit-request-banner status-open">' +
      '<p>Your requested change to <span class="mono">' + fmtTime(req.start) + '–' + fmtTime(req.end) + '</span> was declined' +
        (req.note ? ' — "' + esc(req.note) + '"' : '') + '.</p>' +
      '<button class="btn btn-secondary" data-action="dismiss-edit-request" data-shift="' + shift.id + '">Dismiss</button>' +
    '</div>';
  }
  return '<div class="shift-actions"><button class="btn btn-secondary" data-action="request-edit" data-shift="' + shift.id + '">Request a shift change</button></div>';
}
function openEditRequestModal(id){
  var s = STATE.shifts.find(function(x){ return x.id===id; });
  if(!s || s.staffId !== ui.me) return;
  document.getElementById('detailBox').innerHTML = editRequestFormHTML(s);
  document.getElementById('detailOverlay').classList.add('show');
}
function editRequestFormHTML(shift){

    '<label class="field-label" style="margin-top:10px;">New start</label>' +

    '<input type="time" id="reqEnd" value="' + shift.end + '">' +

      '<button class="btn btn-primary" data-action="submit-edit-request" data-shift="' + shift.id + '">Send request</button>' +
      '<button class="btn btn-secondary" data-action="close-detail">Cancel</button>' +

function renderMyShifts(){
  if(!ui.me){
    return '<div class="empty">Select your name above to see your shifts and take action on them.</div>';
  }
  var mine = shiftsForStaff(ui.me);
  var out = '<h2 class="section-title">Your shifts this week</h2>' +
    '<p class="section-sub">Accept a shift to confirm you\'ll be there, or release it so someone else can pick it up.</p>';
  if(!mine.length){
    out += '<div class="empty">No shifts scheduled for you this week. Check the Availability tab to let the team know when you\'re free.</div>';
  } else {
    out += mine.map(function(s){ return shiftCardHTML(s, {mineActions:true}); }).join('');

  var open = openShifts().filter(function(s){ return s.staffId !== ui.me; });
  out += '<h2 class="section-title" style="margin-top:22px;">Open shifts you could pick up</h2>' +
    '<p class="section-sub">Anyone can grab these — first tap wins.</p>';

    out += '<div class="empty">No open shifts right now.</div>';
  } else {
    out += open.map(function(s){ return shiftCardHTML(s, {claimAction:true, showWho:true}); }).join('');

function renderFullWeek(){
  var viewed = resolveViewedWeek();
  var isAdmin = ui.mgrUnlocked;

  var out = '<h2 class="section-title">Full week at a glance</h2>' +
    '<p class="section-sub">Tap a shift to see details' + (isAdmin ? ', or tap any square to add, edit or remove a shift' : ' and accept, decline, or claim it') + '.</p>';

  out += '<div class="week-nav">' +
    '<button class="ghost-btn" data-action="week-prev">‹ Prev</button>' +
    '<div class="week-nav-label">' +
      '<div style="font-weight:800; font-size:0.92rem;">' + esc(viewed.weekLabel) + '</div>' +
      (viewed.isActive
        ? '<span class="badge status-confirmed">Live week</span>'
        : '<span class="badge" style="background:var(--surface-2); color:var(--ink-soft);">' + (viewed.key < weekStartKey() ? 'Past week' : 'Preview — not started yet') + '</span>') +
    '</div>' +
    '<button class="ghost-btn" data-action="week-next">Next ›</button>' +
  '</div>';
  if(!viewed.isActive){
    out += '<button class="ghost-btn" data-action="week-jump-active" style="display:block; margin:0 auto 14px;">Jump to live week</button>';
  }

  out += '<div class="legend">' +
    '<span><span class="dot" style="background:var(--status-pending);"></span>Awaiting response</span>' +
    '<span><span class="dot" style="background:var(--status-confirmed);"></span>Confirmed</span>' +
    '<span><span class="dot" style="background:var(--status-open);"></span>Open — needs coverage</span>' +
  '</div>';

  var rows = '';
  STATE.staff.forEach(function(s){
    rows += '<tr><td>' + esc(s.name) + '</td>';
    viewed.days.forEach(function(d){
      var sh = viewed.shifts.find(function(x){ return x.staffId===s.id && x.day===d.key; }) ||
               viewed.shifts.find(function(x){ return x.originalStaffId===s.id && x.day===d.key && x.status==='open'; });
      if(sh){
        var cellConflict = viewed.isActive ? availabilityConflict(sh) : null;
        var csty = cellStatusStyle(sh.status);
        var cellBorder = cellConflict ? 'box-shadow:inset 0 0 0 2px var(--status-open);' : '';
        var titleText = statusInfo(sh).label + (cellConflict ? ' — ' + cellConflict.reason : '');
        rows += '<td><span class="cell-shift clickable" data-action="grid-cell" data-week="' + viewed.key + '" data-day="' + d.key + '" data-staff="' + s.id + '" style="background:' + csty.bg + '; color:' + csty.fg + ';' + cellBorder + '" title="' + esc(titleText) + '">' +
          '<span class="cell-time mono">' + (cellConflict ? '⚠ ' : '') + fmtTime(sh.start) + '–' + fmtTime(sh.end) + '</span>' +
          '<span class="cell-role">' + esc(roleLabel(shiftRole(sh))) + '</span>' +
        '</span></td>';
      } else if(isAdmin){
        rows += '<td><span class="cell-shift clickable cell-empty" data-action="grid-cell" data-week="' + viewed.key + '" data-day="' + d.key + '" data-staff="' + s.id + '" title="Add a shift for ' + esc(s.name) + '">+</span></td>';
      } else {
        rows += '<td><span class="cell-dash">–</span></td>';
      }
    });
    rows += '</tr>';
  });
  var head = '<tr><th>Staff</th>' + viewed.days.map(function(d){ return '<th>' + d.label + '<br>' + d.date + '</th>'; }).join('') + '</tr>';
  out += '<div class="scrollx"><table class="grid">' + head + rows + '</table></div>';
  return out;
}

var AVAIL_LABELS = {available:'Available', unavailable:'Not available', limited:'Limited'};
function renderAvailability(){
  var out = '<h2 class="section-title">Your availability</h2>' +
    '<p class="section-sub">Let the team know which days you can work this week.</p>';
  if(!ui.me){
    out += '<div class="empty">Select your name above to submit your availability.</div>';
  } else {
    var mineAvail = STATE.availability[ui.me] || { days:{}, note:'' };
    out += '<div class="card"><fieldset>';
    STATE.days.forEach(function(d){
      var rec = mineAvail.days[d.key] || {status:'available'};
      out += '<div class="avail-row" data-day="' + d.key + '">' +
        '<div class="avail-day">' + d.label + '</div>' +
        '<div class="seg" data-avail-seg="' + d.key + '">' +
          ['available','unavailable','limited'].map(function(v){
            return '<button type="button" class="' + (rec.status===v ? 'on-'+v : '') + '" data-action="set-avail" data-day="' + d.key + '" data-val="' + v + '">' + AVAIL_LABELS[v] + '</button>';
          }).join('') +
        '</div>' +
      '</div>';
      if(rec.status==='limited'){
        out += '<div class="time-inputs" data-limited-for="' + d.key + '">' +
          '<input type="time" data-action="set-avail-time" data-day="' + d.key + '" data-bound="from" value="' + (rec.from||'09:00') + '"> to ' +
          '<input type="time" data-action="set-avail-time" data-day="' + d.key + '" data-bound="to" value="' + (rec.to||'17:00') + '"></div>';
      }
    });
    out += '</fieldset>';
    out += '<label class="field-label">Notes (optional)</label>' +
      '<textarea rows="2" id="availNote" placeholder="e.g. can swap Thursday for Friday">' + esc(mineAvail.note||'') + '</textarea>';
    out += '<div style="margin-top:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">' +
      '<button class="btn btn-primary" data-action="save-avail">Save my availability</button>' +
      (ui._availDraft ? '<span style="font-size:0.78rem; font-weight:700; color:var(--status-pending);">Unsaved changes — tap Save</span>' : '') +
    '</div>';
    out += '</div>';
  }

  out += '<h2 class="section-title" style="margin-top:22px;">Team availability this week</h2>';
  var ids = Object.keys(STATE.availability);
  if(!ids.length){
    out += '<div class="empty">No one has submitted their availability yet.</div>';
  } else {
    out += '<div class="card">';
    ids.forEach(function(id){
      var s = staffById(id); if(!s) return;
      var rec = STATE.availability[id];
      out += '<div class="avail-summary-row"><div class="avail-name">' + esc(s.name) + '</div><div class="avail-dots">' +
        STATE.days.map(function(d){
          var r = rec.days[d.key] || {status:'available'};
          var bg = r.status==='available' ? 'var(--status-confirmed-soft)' : r.status==='unavailable' ? 'var(--status-open-soft)' : 'var(--status-pending-soft)';
          var fg = r.status==='available' ? 'var(--status-confirmed)' : r.status==='unavailable' ? 'var(--status-open)' : 'var(--status-pending)';
          var label = d.label.slice(0,1);
          var title = d.label + ': ' + AVAIL_LABELS[r.status] + (r.status==='limited' ? ' (' + fmtTime(r.from) + '–' + fmtTime(r.to) + ')' : '');
          return '<span class="d" title="' + esc(title) + '" style="background:' + bg + '; color:' + fg + ';">' + label + '</span>';
        }).join('') +
      '</div>' + (rec.note ? '<div class="avail-note">"' + esc(rec.note) + '"</div>' : '') + '</div>';
    });
    out += '</div>';
  }

  out += '<h2 class="section-title" style="margin-top:22px;">Future time off</h2>' +
    '<p class="section-sub">Already know you\'ll be away on dates beyond this week? Add them here so they\'re on the radar when future weeks get rostered.</p>';
  if(!ui.me){
    out += '<div class="empty">Select your name above to add upcoming time off.</div>';
  } else {
    out += '<div class="card">' +
      '<label class="field-label" style="margin-top:0;">From</label>' +
      '<input type="date" id="timeOffStart" value="' + todayISO() + '">' +
      '<label class="field-label">To</label>' +
      '<input type="date" id="timeOffEnd" value="' + todayISO() + '">' +
      '<label class="field-label">Reason (optional)</label>' +
      '<input type="text" id="timeOffNote" placeholder="e.g. holiday, appointment">' +
      '<div style="margin-top:12px;"><button class="btn btn-primary" data-action="add-timeoff">Add time off</button></div>' +
    '</div>';

    var myTimeOff = STATE.timeOff.filter(function(t){ return t.staffId===ui.me; })
      .sort(function(a,b){ return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
    if(myTimeOff.length){
      out += '<div class="card" style="margin-top:10px;"><h2 class="section-title" style="font-size:0.85rem;">Your time off</h2>';
      myTimeOff.forEach(function(t){
        out += '<div class="avail-summary-row"><div style="flex:1 1 auto;">' +
          '<div style="font-weight:700; font-size:0.85rem;">' + fmtDateDisplay(t.start) + (t.end!==t.start ? ' – ' + fmtDateDisplay(t.end) : '') + '</div>' +
          (t.note ? '<div class="avail-note" style="margin-top:2px;">' + esc(t.note) + '</div>' : '') +
        '</div><button class="icon-btn" data-action="remove-timeoff" data-timeoff="' + t.id + '">Remove</button></div>';
      });
      out += '</div>';
    }
  }

  out += '<h2 class="section-title" style="margin-top:22px;">Everyone\'s upcoming time off</h2>';
  var todayIso = todayISO();
  var upcomingTimeOff = STATE.timeOff.filter(function(t){ return t.end >= todayIso; })
    .sort(function(a,b){ return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
  if(!upcomingTimeOff.length){
    out += '<div class="empty">No upcoming time off has been submitted.</div>';
  } else {
    out += '<div class="card">';
    upcomingTimeOff.forEach(function(t){
      var s = staffById(t.staffId); if(!s) return;
      out += '<div class="avail-summary-row"><div style="flex:1 1 auto;">' +
        '<div style="font-weight:700; font-size:0.85rem;">' + esc(s.name) + ' <span style="font-weight:500; color:var(--muted);">· ' + roleLabel(s.role) + '</span></div>' +
        '<div style="font-size:0.8rem; color:var(--ink-soft); margin-top:2px;">' + fmtDateDisplay(t.start) + (t.end!==t.start ? ' – ' + fmtDateDisplay(t.end) : '') + '</div>' +
        (t.note ? '<div class="avail-note" style="margin-top:2px;">' + esc(t.note) + '</div>' : '') +
      '</div></div>';
    });
    out += '</div>';
  }

  return out;
}
